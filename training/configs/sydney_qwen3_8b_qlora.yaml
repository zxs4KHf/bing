# Sydney-ZH QLoRA 训练配置（LLaMA-Factory）
# 用法（在仓库根目录）：llamafactory-cli train training/configs/sydney_qwen3_8b_qlora.yaml
# 生成：2026-07-26。版本相关字段以你安装的 LLaMA-Factory 文档为准。

### model ----------------------------------------------------------
model_name_or_path: Qwen/Qwen3-8B      # 保守默认（生态最成熟）
# model_name_or_path: Qwen/Qwen3.5-9B  # 进阶候选；切换后 template 也要改为 qwen3_5_nothink
trust_remote_code: true

### method ---------------------------------------------------------
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: all
quantization_bit: 4                    # QLoRA 4-bit：7-9B 官方标称约 6GB 显存即可训

### dataset --------------------------------------------------------
dataset_dir: training/data             # 本仓库自带 dataset_info.json
dataset: sydney_full                   # prepare_data.py 的产物
eval_dataset: sydney_val               # prepare_data.py 的确定性验证切分
# 防灾难性遗忘：可改为 sydney_full,alpaca_zh_demo（用 LF 自带通用数据混 ~15%）
template: qwen3_nothink                 # 人格对话不保留推理链；训练与推理必须一致
enable_thinking: false
cutoff_len: 2048                        # RTX 3060 Ti 8GB 的安全默认值
overwrite_cache: true
preprocessing_num_workers: 4

### output ---------------------------------------------------------
output_dir: training/saves/sydney-qwen3-8b-qlora
logging_steps: 1
save_strategy: epoch
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true
report_to: none

### train ----------------------------------------------------------
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
neftune_noise_alpha: 5                 # 小数据集上明显提升表达多样性

### eval -----------------------------------------------------------
do_eval: true
val_size: 0.0                           # 使用上面的显式 sydney_val
per_device_eval_batch_size: 1
eval_strategy: epoch
load_best_model_at_end: true
metric_for_best_model: eval_loss
